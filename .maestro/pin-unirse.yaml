appId: com.alejandrohernandez.listacompra
name: Unirse con PIN, volver a entrar y PIN incorrecto
tags:
  - pin
---
- launchApp:
    clearState: true

- tapOn: 'Crear una lista'
- tapOn:
    id: 'create-community-name'
- inputText: 'E2E PIN'
- tapOn:
    id: 'create-community-username'
- inputText: 'Ana'
- tapOn:
    id: 'create-community-pin'
- inputText: '1234'
- hideKeyboard
- tapOn: 'Crear la lista'
- extendedWaitUntil:
    visible: 'Lista E2E PIN'
    timeout: 20000

- scrollUntilVisible:
    element:
      text: '.*[A-Z2-9]{3}-[A-Z2-9]{4}.*'
    timeout: 20000
- copyTextFrom:
    text: '.*[A-Z2-9]{3}-[A-Z2-9]{4}.*'
- evalScript: ${output.joinCode = maestro.copiedText.replace(/[^A-Z0-9-]/g, '').slice(-8)}

- launchApp:
    clearState: true
- tapOn: 'Tengo un código'
- inputText: ${output.joinCode}
- tapOn:
    id: 'join-community-username'
- inputText: 'Bea'
- tapOn:
    id: 'join-community-pin'
- inputText: '5678'
- hideKeyboard
- tapOn: 'Entrar en la lista'
- extendedWaitUntil:
    visible: 'Lista E2E PIN'
    timeout: 20000

- launchApp:
    clearState: true
- tapOn: 'Tengo un código'
- inputText: ${output.joinCode}
- tapOn:
    id: 'join-community-username'
- inputText: 'Ana'
- tapOn:
    id: 'join-community-pin'
- inputText: '1234'
- hideKeyboard
- tapOn: 'Entrar en la lista'
- extendedWaitUntil:
    visible: 'Lista E2E PIN'
    timeout: 20000
- scrollUntilVisible:
    element: 'Gestionar miembros'
- tapOn: 'Gestionar miembros'
- extendedWaitUntil:
    visible: 'Bea'
    timeout: 15000
- assertVisible: 'Ana'
- assertNotVisible: 'Ana2'

- launchApp:
    clearState: true
- tapOn: 'Tengo un código'
- inputText: ${output.joinCode}
- tapOn:
    id: 'join-community-username'
- inputText: 'Ana'
- tapOn:
    id: 'join-community-pin'
- inputText: '0000'
- hideKeyboard
- tapOn: 'Entrar en la lista'
- extendedWaitUntil:
    visible: 'Ese nombre ya tiene PIN y no es este.*'
    timeout: 20000
- assertNotVisible: 'Lista E2E PIN'

- back
- assertVisible: 'Tengo un código'
